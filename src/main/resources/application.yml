notification:
  worker:
    poll-interval-ms: 2000
  simulation:
    failure-rate: 0.0
    timeout-rate: 0.0

spring:
  application:
    name: notification-management-service
  datasource:
    url: jdbc:h2:file:./data/notifications;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

